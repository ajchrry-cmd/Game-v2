<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DND Game Master</title>

    <!-- GitHub Pages SPA routing fix for mobile and hash preservation -->
    <script type="text/javascript">
      (function() {
        var l = window.location;
        var path = l.pathname;
        var hash = l.hash;
        var search = l.search;

        // Debug logging for mobile troubleshooting
        console.log('Initial load:', {
          href: l.href,
          pathname: path,
          hash: hash,
          search: search,
          userAgent: navigator.userAgent
        });

        // Handle /Game-v2/join -> /Game-v2/#/join
        if (path.indexOf('/join') !== -1 && !hash) {
          var basePath = path.split('/join')[0];
          if (!basePath.endsWith('/')) basePath += '/';
          l.replace(l.protocol + '//' + l.host + basePath + '#/join');
          return;
        }

        // Handle /Game-v2/player/SESSION_ID -> /Game-v2/#/player/SESSION_ID
        if (path.indexOf('/player/') !== -1 && hash.indexOf('/player/') === -1) {
          var parts = path.split('/player/');
          var sessionId = parts[1];
          var basePath = parts[0];
          if (!basePath.endsWith('/')) basePath += '/';
          l.replace(l.protocol + '//' + l.host + basePath + '#/player/' + sessionId);
          return;
        }

        // Handle case where hash was stripped (some mobile apps do this)
        // Check if there's a query parameter with the intended hash
        if (search && search.indexOf('hash=') !== -1) {
          var hashParam = search.split('hash=')[1].split('&')[0];
          var basePath = path;
          if (!basePath.endsWith('/')) basePath += '/';
          l.replace(l.protocol + '//' + l.host + basePath + '#' + decodeURIComponent(hashParam));
          return;
        }
      })();
    </script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: 'Arial', sans-serif;
        overflow-x: hidden;
        overflow-y: auto;
        background: #000;
      }
      #root {
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
